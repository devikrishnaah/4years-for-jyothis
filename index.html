er just the boy I fell in love with. He was becoming my comfort, my happiness, and my favorite person. The most beautiful part of love is not finding a perfect person, but finding someone who listens to your heart and grows with you.",color:"#FFE0E9",accent:"#FF9BB3",rotation:"rotate-1"},{id:3,label:"Year 3",title:"Distance Made Us Best Friends",content:"Then came the chapter that tested our love in a different way: long distance. Being far away from each other wasn't always easy. We couldn't always meet, see each other's smiles in person, or spend every moment together. But distance never changed the special place we had in each other's hearts. Our relationship became even more beautiful in its own way. Every conversation became precious. Every little message brought happiness. Every moment together felt like a gift. We learned that love isn't only about holding hands or being physically close. Sometimes, love is waiting for a message, sharing stories about our day, listening to each other's problems, and making someone feel loved even from far away. Slowly, our relationship became more than just a romantic bond. We became best friends. We shared our secrets, our silly thoughts, our happiness, our worries, and all those little things that we couldn't share with anyone else. Even with miles between us, we found ways to stay close.",color:"#D9F5E9",accent:"#8BE0B5",rotation:"-rotate-1"},{id:4,label:"Year 4",title:"18th October 2026 - 4 Years",content:"And now, here we are, stepping into our fourth anniversary on 18 October 2026. Four years. Four beautiful chapters. Countless memories. One special love. When I look back, I see the boy I met in 11th class, the introvert who slowly became my closest friend, the boy who was once afraid to confess his feelings, and the person who eventually became such an important part of my life. Today, he is not just my boyfriend. He is my best friend, my secret keeper, my comfort person, and someone with whom I can share the smallest and biggest things in my life. We have grown from classmates into partners, from shy conversations into endless talks, and from a little friendship into a love that has continued through distance and time. Our story is not about being perfect. It is about two people who have shared four years of life, memories, promises, and feelings, and who continue to write their story together. And if someone asks me how our love story started, I will always smile and say: 'It started with a boy from my 11th class who asked me to write his English notebook. I said yes to the notebook, and eventually, I said yes to a love that became one of the most beautiful parts of my life.' Happy 4th anniversary to us, my love! ❤",color:"#E6E0FF",accent:"#B9A7FF",rotation:"rotate-2"}],T0="My Dearest Jyothish ❤",L0=`My baby, from being classmates to becoming lovers and then best friends, our journey has been one of the most beautiful things in my life.
